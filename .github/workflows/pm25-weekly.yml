name: PM2.5 每周更新

# 每周一 18:00 UTC（北京时间周二凌晨 2 点）抓取近 7 天 PM2.5 均值并重新部署；也支持手动触发
on:
  schedule:
    - cron: '0 18 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-pm25:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 抓取近 7 天 PM2.5（Open-Meteo / Copernicus CAMS）
        run: node scripts/fetch-pm25.mjs

      - name: 注入城市数据集
        run: node scripts/build-pm25.mjs

      - name: 提交数据更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/pm25.json src/data/cities_full.json
          if git diff --staged --quiet; then
            echo "本周 PM2.5 数据无变化，跳过提交"
          else
            git commit -m "chore: PM2.5 周均数据自动更新"
            git push
          fi

      - name: 触发 Render 重新部署
        if: success()
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            curl -fsSL "$RENDER_DEPLOY_HOOK" && echo "Render 部署已触发"
          else
            echo "未配置 RENDER_DEPLOY_HOOK secret，依赖 Render 自动部署"
          fi
